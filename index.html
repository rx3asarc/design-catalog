<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>design catalog — components worth taking</title>
<meta name="description" content="769 UI components, blocks and effects from five reference libraries, with source, licence and our port verdict.">
<style>
:root{
  --bg:#0b0b0c; --surface:#131316; --surface-2:#1a1a1e; --line:#26262b; --line-soft:#1e1e23;
  --text:#eceded; --text-dim:#a1a1a8; --text-mute:#74747c;
  --accent:#8b7cf6; --accent-soft:rgba(139,124,246,.14); --accent-line:rgba(139,124,246,.35);
  --ok:#5ec27d; --warn:#e0b355; --bad:#e0736b;
  --radius:10px; --radius-sm:7px; --motion:250ms cubic-bezier(.16,1,.3,1);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--accent-soft)}

/* ---------- shell ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:0 24px 96px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
.top-in{max-width:1240px;margin:0 auto;padding:20px 24px 16px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.brand .count{font-size:12px;color:var(--text-mute)}
.brand .spacer{flex:1}
.brand a.src{font-size:12px;color:var(--text-mute);text-decoration:none;border-bottom:1px solid var(--line);
  padding-bottom:1px}
.brand a.src:hover{color:var(--text)}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 320px;min-width:220px}
.search input{width:100%;height:44px;padding:0 40px 0 40px;border-radius:var(--radius-sm);
  background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:14px;outline:none;
  transition:border-color var(--motion),background var(--motion)}
.search input:focus{border-color:var(--accent-line);background:var(--surface-2)}
.search svg{position:absolute;left:13px;top:13px;width:18px;height:18px;stroke:var(--text-mute);fill:none;stroke-width:1.6}
.search kbd{position:absolute;right:10px;top:11px;font:11px/22px var(--mono);color:var(--text-mute);
  border:1px solid var(--line);border-radius:5px;padding:0 6px;height:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);color:var(--text-dim);
  font-size:12.5px;display:inline-flex;align-items:center;gap:6px;transition:all var(--motion)}
.chip:hover{color:var(--text);border-color:#34343b}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:#d6cfff}
.chip .n{font:11px/1 var(--mono);color:var(--text-mute)}
.chip[aria-pressed="true"] .n{color:#b9adfb}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;margin-top:26px}
.card{text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 15px 13px;display:flex;flex-direction:column;gap:8px;min-height:132px;
  transition:border-color var(--motion),transform var(--motion),background var(--motion)}
.card:hover{border-color:#3a3a43;background:var(--surface-2);transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px}
.card .row1{display:flex;align-items:center;gap:8px}
.card .name{font-weight:600;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .src{margin-left:auto;font-size:11px;color:var(--text-mute);white-space:nowrap}
.card p{margin:0;font-size:13px;color:var(--text-dim);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{margin-top:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;color:var(--text-mute);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
.tag.v{border-color:transparent;background:var(--surface-2)}
.tag.ported{color:var(--ok);background:rgba(94,194,125,.1)}
.tag.candidate{color:#b9adfb;background:var(--accent-soft)}
.tag.rejected{color:var(--bad);background:rgba(224,115,107,.1)}
.tag.parked{color:var(--warn);background:rgba(224,179,85,.1)}
.tag.withheld{color:var(--text-mute)}
.empty{margin:64px auto;text-align:center;color:var(--text-mute);font-size:14px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity var(--motion);z-index:30}
.scrim[data-open="true"]{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(820px,100%);background:var(--bg);
  border-left:1px solid var(--line);transform:translateX(100%);transition:transform var(--motion);z-index:31;
  display:flex;flex-direction:column}
.drawer[data-open="true"]{transform:none}
.d-head{padding:20px 22px 14px;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:10px}
.d-top{display:flex;align-items:flex-start;gap:12px}
.d-top h2{margin:0;font-size:19px;letter-spacing:-.02em}
.d-top .sub{font-size:12.5px;color:var(--text-mute);margin-top:3px}
.x{margin-left:auto;width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--text-dim);flex:none}
.x:hover{color:var(--text);border-color:#3a3a43}
.d-body{overflow:auto;padding:18px 22px 40px;display:flex;flex-direction:column;gap:16px}
.d-body::-webkit-scrollbar{width:10px}
.d-body::-webkit-scrollbar-thumb{background:#26262b;border-radius:8px;border:3px solid var(--bg)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:38px;padding:0 14px;border-radius:var(--radius-sm);border:1px solid var(--line);
  background:var(--surface);font-size:13px;display:inline-flex;align-items:center;gap:7px;
  transition:all var(--motion);text-decoration:none}
.btn:hover{border-color:#3a3a43;background:var(--surface-2)}
.btn.primary{background:var(--accent-soft);border-color:var(--accent-line);color:#d9d2ff}
.btn.primary:hover{background:rgba(139,124,246,.2)}
.cmd{font:12.5px/1.5 var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:11px 13px;color:#cfcac0;overflow:auto;white-space:pre}
.tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line-soft);padding-bottom:0}
.tab{padding:8px 11px;font:12px/1 var(--mono);color:var(--text-mute);border-bottom:2px solid transparent;
  white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
pre.code{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:14px;overflow:auto;max-height:52vh;font:12.5px/1.6 var(--mono);color:#d7d3cb;tab-size:2}
.note{font-size:13px;color:var(--text-dim);line-height:1.55;border-left:2px solid var(--line);padding-left:12px}
.note b{color:var(--text);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font:12.5px/1.5 var(--mono);color:var(--text-mute)}
.kv span:nth-child(even){color:var(--text-dim);word-break:break-all}
.frame{width:100%;height:460px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:var(--surface-2);
  border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;color:var(--text);
  opacity:0;transition:all var(--motion);z-index:40;pointer-events:none}
.toast[data-show="true"]{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){
  .wrap,.top-in{padding-left:16px;padding-right:16px}
  .grid{grid-template-columns:1fr;gap:10px;margin-top:18px}
  .drawer{width:100%;border-left:0}
  .d-body{padding:16px 16px 40px}.d-head{padding:16px 16px 12px}
  .frame{height:340px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>design catalog</h1>
      <span class="count" id="count"></span>
      <span class="spacer"></span>
      <a class="src" id="git" href="#" target="_blank" rel="noreferrer">source on github</a>
    </div>
    <div class="bar">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search 769 components, blocks, effects — try “sidebar”, “thinking”, “chart”" aria-label="Search the catalog" autocomplete="off">
        <kbd>/</kbd>
      </div>
    </div>
    <div class="bar">
      <div class="chips" id="srcChips"></div>
      <div class="chips" id="kindChips"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Nothing matches that. Try a shorter word.</div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" data-open="false">
  <div class="d-head">
    <div class="d-top">
      <div>
        <h2 id="d-title">—</h2>
        <div class="sub" id="d-sub"></div>
      </div>
      <button class="x" id="close" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
    <div class="actions" id="d-actions"></div>
  </div>
  <div class="d-body" id="d-body"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const S = { items: [], sources: {}, q: "", source: null, kind: null, open: null, file: 0 };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.dataset.show = "true";
  clearTimeout(t._h); t._h = setTimeout(() => t.dataset.show = "false", 1900);
}
async function copy(text, what) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast(`copied ${what}`);
}

function matches(it) {
  if (S.source && it.source !== S.source) return false;
  if (S.kind && it.kind !== S.kind) return false;
  if (!S.q) return true;
  const hay = `${it.name} ${it.slug} ${it.one_line ?? ""} ${it.source} ${it.kind} ${it.verdict?.reason ?? ""}`.toLowerCase();
  return S.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}

function render() {
  const list = S.items.filter(matches);
  $("#empty").hidden = list.length > 0;
  $("#count").textContent = `${list.length} of ${S.items.length} items`;
  $("#grid").innerHTML = list.map(it => `
    <button class="card" data-i="${S.items.indexOf(it)}">
      <div class="row1">
        <span class="name">${esc(it.name)}</span>
        <span class="src">${esc(it.source)}</span>
      </div>
      <p>${esc(it.one_line || "—")}</p>
      <div class="foot">
        <span class="tag">${esc(it.kind)}</span>
        ${it.files ? `<span class="tag">${it.files} file${it.files > 1 ? "s" : ""}</span>` : ""}
        ${it.withheld ? `<span class="tag withheld">source withheld</span>` : ""}
        ${it.verdict ? `<span class="tag v ${it.verdict.verdict}">${esc(it.verdict.verdict)}</span>` : ""}
      </div>
    </button>`).join("");
}

function chips() {
  const bySrc = {}, byKind = {};
  for (const it of S.items) { bySrc[it.source] = (bySrc[it.source] || 0) + 1; byKind[it.kind] = (byKind[it.kind] || 0) + 1; }
  const mk = (id, map, key) => {
    $(id).innerHTML = Object.entries(map).sort((a, b) => b[1] - a[1]).map(([k, n]) =>
      `<button class="chip" data-k="${key}" data-v="${esc(k)}" aria-pressed="${S[key] === k}">${esc(k)}<span class="n">${n}</span></button>`
    ).join("");
  };
  mk("#srcChips", bySrc, "source"); mk("#kindChips", byKind, "kind");
}

async function open(it) {
  S.open = it; S.file = 0;
  $("#d-title").textContent = it.name;
  $("#d-sub").textContent = `${it.source} · ${it.kind} · ${it.licence}`;
  const full = await fetch(it.path).then(r => r.json()).catch(() => null);
  const actions = [];
  actions.push(`<button class="btn primary" id="copyAll">Copy code</button>`);
  if (it.install) actions.push(`<button class="btn" id="copyInstall">Copy install command</button>`);
  if (it.page) actions.push(`<a class="btn" href="${esc(it.page)}" target="_blank" rel="noreferrer">Their page ↗</a>`);
  if (it.page && !it.withheld) actions.push(`<button class="btn" id="showDemo">Show live demo</button>`);
  actions.push(`<a class="btn" href="${esc(it.path)}" target="_blank" rel="noreferrer">item json</a>`);
  $("#d-actions").innerHTML = actions.join("");

  const code = full?.files ?? [];
  const body = [];
  if (it.withheld) {
    body.push(`<div class="note"><b>Source withheld.</b> ${esc(it.withheld_reason)}. The entry, its facts and our verdict are published; the code is not ours to republish.</div>`);
  }
  if (it.verdict) {
    body.push(`<div class="note"><b>${esc(it.verdict.verdict)}</b> — ${esc(it.verdict.reason || "")}${it.verdict.ours_path ? ` <span style="color:var(--text-mute)">ours: ${esc(it.verdict.ours_path)}</span>` : ""}</div>`);
  }
  if (it.install) body.push(`<div class="cmd" id="installCmd">${esc(it.install)}</div>`);
  if (code.length) {
    body.push(`<div class="tabs" id="tabs">${code.map((f, i) =>
      `<button class="tab" data-f="${i}" aria-selected="${i === 0}">${esc(f.path.split("/").pop())}</button>`).join("")}</div>`);
    body.push(`<pre class="code" id="code">${esc(code[0].content)}</pre>`);
    body.push(`<div class="kv" id="meta">${metaRows(code[0])}</div>`);
  }
  if (full?.facts?.length) {
    body.push(`<div class="kv">${full.facts.slice(0, 12).map(f =>
      `<span>${esc(f.key)}</span><span>${esc(f.value)}${f.unit ? " " + esc(f.unit) : ""}</span>`).join("")}</div>`);
  }
  body.push(`<div style="height:8px"></div>`);
  $("#d-body").innerHTML = body.join("");
  $("#d-body").scrollTop = 0;

  $("#copyAll")?.addEventListener("click", () => {
    const text = code.length === 1 ? code[0].content
      : code.map(f => `// --- file: ${f.path} ---\n${f.content}`).join("\n\n");
    copy(text, `${code.length} file${code.length > 1 ? "s" : ""}, ${text.length} bytes`);
  });
  $("#copyInstall")?.addEventListener("click", () => copy(it.install, "install command"));
  $("#showDemo")?.addEventListener("click", () => {
    const f = document.createElement("iframe");
    f.className = "frame"; f.loading = "lazy"; f.referrerPolicy = "no-referrer"; f.src = it.page;
    f.title = `${it.name} live demo on ${it.source}`;
    $("#d-body").prepend(f);
  });
  $("#tabs")?.addEventListener("click", e => {
    const b = e.target.closest(".tab"); if (!b) return;
    S.file = +b.dataset.f;
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t === b));
    $("#code").textContent = code[S.file].content;
    $("#meta").innerHTML = metaRows(code[S.file]);
  });

  $("#drawer").dataset.open = "true"; $("#scrim").dataset.open = "true";
  $("#close").focus();
}
const metaRows = f => `<span>path</span><span>${esc(f.path)}</span>
  <span>bytes</span><span>${f.bytes.toLocaleString()}</span>
  <span>sha256</span><span>${esc(f.sha256)}</span>`;

function close() {
  $("#drawer").dataset.open = "false"; $("#scrim").dataset.open = "false"; S.open = null;
}

$("#grid").addEventListener("click", e => {
  const c = e.target.closest(".card"); if (c) open(S.items[+c.dataset.i]);
});
document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) { const k = chip.dataset.k; S[k] = S[k] === chip.dataset.v ? null : chip.dataset.v; chips(); render(); }
});
$("#q").addEventListener("input", e => { S.q = e.target.value.trim(); render(); });
$("#close").addEventListener("click", close);
$("#scrim").addEventListener("click", close);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.open) close();
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});

(async function boot() {
  const idx = await fetch("data/index.json").then(r => r.json());
  S.items = idx.items; S.sources = idx.sources;
  const repo = location.origin + location.pathname.replace(/\/$/, "");
  $("#git").href = "https://github.com/rx3asarc/design-catalog";
  chips(); render();
})();
</script>
</body>
</html>
